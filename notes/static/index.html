<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f2f4eb"><title>little notes</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<div class="shell">
<header class="topbar"><a class="brand" href="/" aria-label="Little notes home"><span class="brand-mark" aria-hidden="true">✳</span> little notes<span class="brand-dot">.</span></a><a class="docs-link" href="/api-docs">API docs <span aria-hidden="true">↗</span></a></header>
<main>
<form id="composer" class="composer"><label for="note-text">What’s on your mind?</label><textarea id="note-text" name="text" placeholder="Leave a little thought here…" maxlength="20000" required rows="3"></textarea><div class="composer-bottom"><span class="input-hint">Just words. No titles, no fuss.</span><button class="primary" id="save-button" type="submit">Add note <span aria-hidden="true">↗</span></button></div></form>
<div id="feedback" role="status" aria-live="polite"></div>
<section class="collection" aria-labelledby="collection-title"><div class="collection-heading"><div><h2 id="collection-title">Your notes <span id="count" class="count">0</span></h2></div><span class="sort-label">↓ Newest first</span></div><div id="notes" class="notes-grid" aria-busy="true"></div><div id="empty" class="empty" hidden><span aria-hidden="true">✳</span><h3>A little space, all yours.</h3><p>Add your first note above. We’ll keep it here.</p></div><button id="load-more" class="secondary" hidden>Load more notes</button></section>
</main><footer class="footer"><span>A place for the little things.</span><span>Saved here. Ready when you are.</span></footer>
</div>
<dialog id="delete-dialog"><form method="dialog"><span class="eyebrow">LET IT GO?</span><h2>Delete this note?</h2><p>This will permanently remove it.</p><div class="dialog-actions"><button class="secondary" value="cancel">Keep note</button><button class="danger" value="delete">Delete note</button></div></form></dialog>
</body></html>
