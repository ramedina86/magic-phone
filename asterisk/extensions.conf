; Included by extensions.conf. No includes/switches or wildcard routes here.
[magic-phone]
exten => 101,1,Answer()
 same => n,Playback(custom/magic-phone/welcome/placeholder)
 same => n,Hangup()
exten => 102,1,Gosub(magic-rotation,s,1(audiobooks,audiobook_next,${MAGIC_AUDIOBOOKS}))
 same => n,Hangup()
exten => 103,1,Gosub(magic-rotation,s,1(music,music_next,${MAGIC_MUSIC}))
 same => n,Hangup()
exten => 201,1,Gosub(magic-family,s,1(${MAGIC_CONTACT_201}))
 same => n,Hangup()
exten => 202,1,Gosub(magic-family,s,1(${MAGIC_CONTACT_202}))
 same => n,Hangup()
exten => 203,1,Gosub(magic-family,s,1(${MAGIC_CONTACT_203}))
 same => n,Hangup()
exten => 204,1,Gosub(magic-family,s,1(${MAGIC_CONTACT_204}))
 same => n,Hangup()
exten => 205,1,Gosub(magic-family,s,1(${MAGIC_CONTACT_205}))
 same => n,Hangup()

[magic-rotation]
exten => s,1,Answer()
 same => n,GotoIf($[${ARG3} < 1]?unavailable)
 same => n,Set(TRACK=${DB(magic/${ARG2})})
 same => n,ExecIf($["${FILTER(0-9,${TRACK})}" != "${TRACK}" | "${TRACK}" = ""]?Set(TRACK=1))
 same => n,ExecIf($[${TRACK} < 1 | ${TRACK} > ${ARG3}]?Set(TRACK=1))
 same => n,Set(DB(magic/${ARG2})=$[(${TRACK} % ${ARG3}) + 1])
 same => n,Playback(custom/magic-phone/${ARG1}/${TRACK})
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?done)
 same => n(unavailable),Log(WARNING,Magic phone playlist unavailable)
 same => n,Hangup()
 same => n(done),Return()

[magic-family]
exten => s,1,GotoIf($["${MAGIC_PROVIDER}" != "yes" | "${ARG1}" = ""]?unavailable)
 same => n,Set(DEST=${ARG1})
 same => n,ExecIf($["${MAGIC_DIAL_FORMAT}" = "digits"]?Set(DEST=${ARG1:1}))
 same => n,ExecIf($["${MAGIC_DIAL_FORMAT}" = "00"]?Set(DEST=00${ARG1:1}))
 same => n,Set(CALLERID(num)=${MAGIC_CALLER_ID})
 same => n,Dial(PJSIP/${DEST}@magic-trunk,${MAGIC_RING},iL(${MAGIC_LIMIT_MS}))
 same => n,Log(NOTICE,Magic phone family call ended: ${DIALSTATUS})
 same => n,Return()
 same => n(unavailable),Log(NOTICE,Magic phone contact or provider unavailable)
 same => n,Hangup()

[magic-reject-inbound]
exten => s,1,Hangup()
